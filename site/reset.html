<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <img class="logo" src="assets/logo.svg" alt="Business Hub logo">
      <form id="reset-form" class="hidden" novalidate>
        <h1>Set a new password</h1>
        <label for="pw1">New password (at least 12 characters)</label>
        <input id="pw1" type="password" autocomplete="new-password" minlength="12" required>
        <label for="pw2">Confirm new password</label>
        <input id="pw2" type="password" autocomplete="new-password" minlength="12" required>
        <button class="primary" type="submit">Save password</button>
      </form>
      <div id="waiting"><h1>Checking your link…</h1></div>
      <div id="msg" class="msg hidden" role="alert"></div>
      <p class="mt"><a href="index.html">← Back to sign in</a></p>
